name: conatel_presence
description: Système de présence CONATEL
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP & API
  dio: ^5.4.3
  retrofit: ^4.1.0

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^13.2.4

  # QR Code
  mobile_scanner: ^5.1.1     # Scanner QR avec caméra
  qr_flutter: ^4.1.0         # Afficher QR (kiosque)

  # GPS
  geolocator: ^11.0.0
  permission_handler: ^11.3.1

  # Caméra (selfie)
  camera: ^0.11.0
  image_picker: ^1.1.0

  # Stockage local
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.3
  hive_flutter: ^1.1.0

  # UI
  cupertino_icons: ^1.0.6
  flutter_svg: ^2.0.10
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  fl_chart: ^0.67.0           # Graphiques statistiques
  intl: ^0.19.0

  # Utilitaires
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  connectivity_plus: ^6.0.3
  local_auth: ^2.2.0          # Biométrie locale (PIN téléphone) - déjà prêt !

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.9
  retrofit_generator: ^8.1.0
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
 
